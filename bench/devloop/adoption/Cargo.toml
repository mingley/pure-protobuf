[package]
name = "pbrs-adoption-corpus"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

# A small independently runnable corpus/oracle consumer. The parent devloop
# harness consumes this library when registering SB-26b measurements.
[workspace]

[features]
default = []
bridge = ["dep:protobuf-tonic"]

[dependencies]
pbrs = { path = "../../.." }
prost = "0.14"
protobuf-tonic = { path = "../../../protobuf-tonic", optional = true }
serde_json = "1"

[build-dependencies]
pbrs = { path = "../../.." }
prost-build = "0.14"

[[bin]]
name = "bridge-inventory"
path = "src/bin/bridge-inventory.rs"
required-features = ["bridge"]
