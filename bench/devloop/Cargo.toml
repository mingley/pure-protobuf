[package]
name = "devloop"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
pbrs = { path = "../..", features = ["copy-counts"] }
pbrs-grpc = { path = "../../pbrs-grpc", features = ["copy-counts"] }
prost = "0.14"
prost013 = { package = "prost", version = "0.13" }
prost_tat = { path = "../../prost_tat" }
protobuf = "=4.35.1-release"
v4_tat = { path = "../../v4_tat" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tonic-prost-build = "0.14"
pbrs = { path = "../.." }

[[bin]]
name = "devloop"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
