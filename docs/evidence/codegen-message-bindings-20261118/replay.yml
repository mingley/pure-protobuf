name: Verify retained message-binding diagnostics
on:
  push:
    branches: [scratch/message-bindings-replay-20261118]
permissions: {}
env:
  CANDIDATE: 8fdf4f106daa67ddb7a4187fcf7d1b430e548b9d
  BASE: 9061b8ee0a75d32acb19ebf7090e4a95660012db
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: "1.99.1"
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original report and actual generated source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/message-bindings-replay"
          mkdir -p "$work/original" "$work/evidence"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse "$GITHUB_SHA^")" = "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^")" = "$BASE"
          test "$(git diff --name-only "$BASE" "$CANDIDATE")" = src/codegen/parse.rs
          cp .github/experiments/codegen-message-bindings/verify.py "$work/evidence/verify.py"
          cp .github/workflows/scratch-message-bindings-replay-20261118.yml "$work/evidence/workflow.yml"
          git checkout --detach "$CANDIDATE"
          test -z "$(git status --porcelain)"
          curl --fail --silent --show-error --location --max-time 60 --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mingley/pure-protobuf/actions/artifacts/14447182993/zip --output "$work/original.zip"
          printf '1662c301aa2b19260882f56a26f391d797f61baa4b72e54de50897098a8def01  %s\n' "$work/original.zip" | sha256sum -c -
          unzip -q "$work/original.zip" -d "$work/original"
          python3 -B "$work/evidence/verify.py" "$work/original" "$work/evidence/results.json" | tee "$work/evidence/verification.log"
      - name: Retain independent verification and raw records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: message-bindings-replay-20261118
          path: ${{ runner.temp }}/message-bindings-replay/evidence
          retention-days: 90
          if-no-files-found: warn
  cleanup:
    if: always()
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Delete exact scratch ref
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/scratch/message-bindings-replay-20261118
          git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin ":$GITHUB_REF"
