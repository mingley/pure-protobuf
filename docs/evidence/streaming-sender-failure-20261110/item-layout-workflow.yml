name: Upload item layout witness on b0e
on:
  push:
    branches: [codex-upload-item-layout-b0e-20261110]
permissions:
  contents: write
jobs:
  layout:
    if: ${{ github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and scratch-only paths
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b0e693148fd8adcd242aa247358bb87dcacb99f5
          test "$(git show -s --format=%T HEAD^)" = 2083457b34ae0084e7ba280759d425379d313dd8
          test "$(git hash-object pbrs-grpc/src/stream.rs)" = 0eb99731939fac66969f22ec96b0064348a3d122
          test "$(git hash-object pbrs-grpc/src/status.rs)" = 2c2d8973943beea3b20d425a0aa0a7c4ae2d6779
          test "$(git hash-object pbrs-grpc/src/binlog/logger.rs)" = fa739c8021fb7169e95c2c93daa64f39fe4bc6dc
          test "$(git hash-object pbrs-grpc/src/binlog/filter.rs)" = 0e9405507304fe94e50fef81b57cdce8774d0dc2
          test "$(git hash-object pbrs-grpc/src/binlog/entry.rs)" = 7386f892a1c0ea32614ef3febc1a21a80f838565
          test "$(git hash-object pbrs-grpc/src/binlog/sink.rs)" = d6742f5015bbdc15305b48f2271fdcfaef2ad6ed
          test "$(git hash-object pbrs-grpc/build.rs)" = 05cb9dcc41fefeeb8212db7ed323dc17ec33a655
          test "$(git hash-object pbrs-grpc/proto/hello.proto)" = dfc17abc0775582a08134e7d6ddee869c8710438
          test "$(git hash-object pbrs-grpc/proto/grpc/testing/messages.proto)" = 61673a5f319b8010f85ab5bbb0a38c1a681b1c44
          test "$(git hash-object pbrs-grpc/tests/item_layout_witness.rs)" = af513179a0e7469a25ec61e275d657550de05aea
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/paths"
          printf '%s\n' .github/workflows/upload-item-layout-witness.yml pbrs-grpc/tests/item_layout_witness.rs | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/paths"
          test -z "$(git status --porcelain)"
      - name: Install compilers and protoc
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install stable --profile minimal
          rustc +1.85.0 -Vv
          rustc +stable -Vv
          protoc --version
          uname -a
          lscpu | grep -E 'Architecture|Model name|Thread\(s\) per core' | head -5
      - name: Rust 1.85 item layout and allocator witness
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 test --locked --release -p pbrs-grpc --test item_layout_witness -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/item-layout-msrv.txt"
      - name: Stable item layout and allocator witness
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable test --locked --release -p pbrs-grpc --test item_layout_witness -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/item-layout-stable.txt"
      - name: Stable Zstd item layout and allocator witness
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable test --locked --release -p pbrs-grpc --features zstd --test item_layout_witness -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/item-layout-zstd.txt"
      - name: Optional actual private CallState compiler layout
        shell: bash
        run: |
          set -u -o pipefail
          RUSTC_BOOTSTRAP=1 timeout 360 cargo +stable rustc --locked --release -p pbrs-grpc --lib -- -Zprint-type-sizes > "$RUNNER_TEMP/type-sizes-full.txt" 2>&1
          result=$?
          set -e
          python3 - "$RUNNER_TEMP/type-sizes-full.txt" "$RUNNER_TEMP/call-state-layout.txt" "$result" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          keep = []
          active = False
          for line in lines:
              if line.startswith("print-type-size type:"):
                  active = "binlog::logger::CallState" in line
              if active:
                  keep.append(line)
          Path(sys.argv[2]).write_text("\n".join(keep) + "\n")
          print("COMPILER_LAYOUT_DIAGNOSTIC_EXIT", sys.argv[3])
          if keep:
              print("\n".join(keep))
          else:
              print("PRIVATE_CALL_STATE_LAYOUT_NOT_REPORTED")
          PY
      - name: Preserve raw witness outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: upload-item-layout-b0e
          path: |
            ${{ runner.temp }}/item-layout-msrv.txt
            ${{ runner.temp }}/item-layout-stable.txt
            ${{ runner.temp }}/item-layout-zstd.txt
            ${{ runner.temp }}/call-state-layout.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Checkout scratch for cleanup
        if: ${{ always() }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .cleanup-scratch
          fetch-depth: 1
          persist-credentials: true
      - name: Delete exact scratch head
        if: ${{ always() }}
        working-directory: .cleanup-scratch
        run: |
          set -euo pipefail
          branch=codex-upload-item-layout-b0e-20261110
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git push --force-with-lease="refs/heads/$branch:$GITHUB_SHA" origin ":refs/heads/$branch"
