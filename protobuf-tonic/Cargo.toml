[package]
name = "protobuf-tonic"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "tonic 0.14+ Codec over pbrs (not tonic-prost; kernel stays tonic-free)"

[build-dependencies]
pbrs = { path = ".." }

[dependencies]
bytes = "1"
http = "1"
pbrs = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
