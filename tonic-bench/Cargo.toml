[package]
name = "pbrs-tonic-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Same-process tonic Codec / unary bench: ProtobufCodec vs ProstCodec (not the kernel wire bench)"

[workspace]

[dependencies]
bytes = "1"
pbrs = { path = ".." }
prost = "0.14"
protobuf-tonic = { path = "../protobuf-tonic" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[[bin]]
name = "tonic-bench"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
