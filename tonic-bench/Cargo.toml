[package]
name = "pbrs-tonic-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Same-process codec survey: pbrs vs prost vs protobuf 4.35.1-release (upb) on common unary shapes"

[workspace]

[dependencies]
bytes = "1"
pbrs = { path = ".." }
prost = "0.14"
protobuf-tonic = { path = "../protobuf-tonic" }
protobuf = { version = "=4.35.1-release" }

[build-dependencies]
pbrs = { path = ".." }
prost-build = "0.14"

[[bin]]
name = "tonic-bench"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
