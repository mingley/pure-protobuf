name: miri-kernels

# QG-01: PR-time Miri for new kernels and engines. Runs on every PR that
# touches a kernel path and blocks on failure (once marked a required
# status check in the repository settings). Kept separate from
# compatibility.yml so kernel PRs do not pay for the 30-minute interop
# matrix; the scheduled lane there remains the deep ASan/LSan proof.

on:
  pull_request:
    paths:
      - 'pbrs-h2/**'
      - 'pbrs-grpc/src/h2_backend/**'
      - 'pbrs-grpc/src/server/rpc.rs'
      - 'pbrs-grpc/src/rpc_cancel.rs'
      - 'pbrs-grpc/src/lazy_ext.rs'
      - 'pbrs-grpc/src/static_copy.rs'
      - 'pbrs-grpc/src/grpc_prefix.rs'
      - 'pbrs-grpc/src/server/http_name.rs'
      - 'pbrs-grpc/src/lib.rs'
      - 'pbrs-grpc/src/request.rs'
      - 'pbrs-grpc/Cargo.toml'
      - 'scripts/miri-grpc-kernels.py'
      - 'src/runtime/**'
      - 'src/table.rs'
      - 'src/packed.rs'
      - 'src/wire.rs'
      - 'src/lazy.rs'
      - 'src/string.rs'
      - 'fuzz/fuzz_targets/h2_frame.rs'
      - 'fuzz/fuzz_targets/varint_diff.rs'
      - 'fuzz/fuzz_targets/segmented.rs'
      - '.github/workflows/miri-kernels.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pbrs-h2/**'
      - 'pbrs-grpc/src/h2_backend/**'
      - 'pbrs-grpc/src/server/rpc.rs'
      - 'pbrs-grpc/src/rpc_cancel.rs'
      - 'pbrs-grpc/src/lazy_ext.rs'
      - 'pbrs-grpc/src/static_copy.rs'
      - 'pbrs-grpc/src/grpc_prefix.rs'
      - 'pbrs-grpc/src/server/http_name.rs'
      - 'pbrs-grpc/src/lib.rs'
      - 'pbrs-grpc/src/request.rs'
      - 'pbrs-grpc/Cargo.toml'
      - 'scripts/miri-grpc-kernels.py'
      - 'src/runtime/**'
      - 'src/table.rs'
      - 'src/packed.rs'
      - 'src/wire.rs'
      - 'src/lazy.rs'
      - 'src/string.rs'
      - 'fuzz/fuzz_targets/h2_frame.rs'
      - 'fuzz/fuzz_targets/varint_diff.rs'
      - 'fuzz/fuzz_targets/segmented.rs'
      - '.github/workflows/miri-kernels.yml'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Miri on pbrs core and generated-kernel integration tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-strict-provenance"
        run: |
          set -euo pipefail
          rustc --version
          cargo miri --version
          cargo miri test --locked -p pbrs --lib --test runtime --test upb_kernel
      - name: Miri on the shipping embedded HTTP/2 kernels
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-strict-provenance"
        run: |
          set -euo pipefail
          python3 scripts/miri-grpc-kernels.py
