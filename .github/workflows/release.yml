# The only crates.io publisher. Incremental main pushes do not publish
# (release-plz.yml and first-publish.yml are disabled).
#
# Credentials: crates.io Trusted Publishing exchanges this workflow's OIDC
# identity for a short-lived registry token. No long-lived registry secret.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (cargo publish --dry-run only; never upload)'
        type: boolean
        default: true
      confirm:
        description: 'Type publish to upload when dry_run is false'
        type: string
        default: ''

# Serialize all publishers so a retry cannot race a live upload.
concurrency:
  group: crates-io-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  required:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to crates.io
    needs: required
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Decide dry-run vs upload
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '' }}
          CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DRY_RUN_INPUT" == "true" ]]; then
              echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            elif [[ "$CONFIRM" == "publish" && "$REF" == refs/tags/v* ]]; then
              echo "mode=publish" >> "$GITHUB_OUTPUT"
            else
              echo "::error::dispatch upload requires a v* tag ref, dry_run=false and confirm=publish"
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/v* ]]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unsupported event $EVENT_NAME $REF"
            exit 1
          fi

      - name: Fetch dependencies for offline package rehearsal
        if: steps.mode.outputs.mode == 'dry-run'
        run: cargo fetch --locked

      - name: Require a signed and GitHub-verified release tag
        if: steps.mode.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object')"
          if [[ "$(jq -r .type <<<"$object")" != "tag" ]]; then
            echo "::error::release tags must be annotated and signed (lightweight tag refused)"
            exit 1
          fi
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .sha <<<"$object")" --jq '.verification.verified')"
          if [[ "$verified" != "true" ]]; then
            echo "::error::GitHub did not verify the release tag signature"
            exit 1
          fi

      - name: Authenticate to crates.io with OIDC
        if: steps.mode.outputs.mode == 'publish'
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          DRY_RUN: ${{ steps.mode.outputs.mode == 'dry-run' && '1' || '0' }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./scripts/publish-crates.sh

      - name: Collect packaged crates
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/package/*.crate dist/

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/pure-protobuf-${{ github.sha }}.cdx.json
          upload-artifact: false

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

      - name: Retain dry-run and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.mode.outputs.mode == 'publish' }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
