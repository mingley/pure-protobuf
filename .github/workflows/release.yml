# The only crates.io publisher. Incremental main pushes do not publish
# (release-plz.yml and first-publish.yml are disabled).
#
# Credentials: prefers crates.io Trusted Publishing (OIDC short-lived token)
# and falls back to secrets.CRATES_IO_TOKEN in publish mode until Trusted
# Publishing is configured on crates.io.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package release artifacts only; never upload'
        type: boolean
        default: true
      confirm:
        description: 'Type publish to upload when dry_run is false'
        type: string
        default: ''

# Rehearsals cannot evict a pending upload from its concurrency group.
# Actual publishers remain serialized so a retry cannot race a live upload.
concurrency:
  group: ${{ (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && format('release-rehearsal-{0}', github.sha) || 'crates-io-publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  required:
    # Automatic rehearsals reuse the exact successful main-push CI run.
    # Every tag/manual request still executes the full reusable policy.
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  context:
    name: Select qualified release source
    needs: required
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_run' || needs.required.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.context.outputs.eligible }}
      mode: ${{ steps.context.outputs.mode }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      context_json: ${{ steps.context.outputs.context_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release event policy
        run: python3 -B -m unittest tests.test_release_context -q
      - name: Select exact source and release mode
        id: context
        env:
          REQUIRED_CI_RESULT: ${{ needs.required.result }}
        run: python3 -B scripts/release-context.py

  publish:
    name: Package or publish crates
    needs: [required, context]
    if: >-
      ${{ always() && !cancelled() && needs.context.result == 'success' &&
          needs.context.outputs.eligible == 'true' &&
          ((github.event_name == 'workflow_run' && needs.required.result == 'skipped' && needs.context.outputs.mode == 'dry-run') ||
           (github.event_name != 'workflow_run' && needs.required.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected source and release mode
        id: mode
        env:
          REQUIRED_CI_RESULT: ${{ needs.required.result }}
          RELEASE_CONTEXT_JSON: ${{ needs.context.outputs.context_json }}
        run: python3 -B scripts/release-context.py --verify-context --metadata-path dist/release-context.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies for offline package rehearsal
        if: steps.mode.outputs.mode == 'dry-run'
        run: cargo fetch --locked

      - name: Require a signed and GitHub-verified release tag
        if: steps.mode.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: |
          set -euo pipefail
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object')"
          if [[ "$(jq -r .type <<<"$object")" != "tag" ]]; then
            echo "::error::release tags must be annotated and signed (lightweight tag refused)"
            exit 1
          fi
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .sha <<<"$object")")"
          if [[ "$(jq -r .verification.verified <<<"$tag")" != "true" ]]; then
            echo "::error::GitHub did not verify the release tag signature"
            exit 1
          fi
          if [[ "$(jq -r .tag <<<"$tag")" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::signed tag name does not match the requested release tag"
            exit 1
          fi
          if [[ "$(jq -r .object.type <<<"$tag")" != "commit" || "$(jq -r .object.sha <<<"$tag")" != "$RELEASE_SOURCE_SHA" ]]; then
            echo "::error::verified release tag does not target the checked-out CI commit"
            exit 1
          fi

      - name: Authenticate to crates.io with OIDC
        if: steps.mode.outputs.mode == 'publish'
        id: crates-io
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.mode.outputs.mode == 'publish' && (steps.crates-io.outputs.token || secrets.CRATES_IO_TOKEN) || '' }}
          DRY_RUN: ${{ steps.mode.outputs.mode == 'dry-run' && '1' || '0' }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./scripts/publish-crates.sh

      - name: Collect packaged crates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tomllib

          package_dir = Path(os.environ.get("CARGO_TARGET_DIR", "target")) / "package"
          archives = []
          for manifest_path in ("Cargo.toml", "protobuf-tonic/Cargo.toml", "pbrs-grpc/Cargo.toml"):
              package = tomllib.loads(Path(manifest_path).read_text())["package"]
              archive = package_dir / f"{package['name']}-{package['version']}.crate"
              if not archive.is_file():
                  raise SystemExit(f"missing release archive: {archive}")
              archives.append(archive)

          destination = Path("dist")
          destination.mkdir(parents=True, exist_ok=True)
          for archive in archives:
              shutil.copy2(archive, destination / archive.name)
          PY

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/pure-protobuf-${{ needs.context.outputs.source_sha }}.cdx.json
          upload-artifact: false

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

      - name: Retain dry-run and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ needs.context.outputs.source_sha }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.mode.outputs.mode == 'publish' }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
