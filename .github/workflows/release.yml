name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish to crates.io)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run Tests
        run: cargo test --workspace

      - name: Dry Run Publish
        if: ${{ inputs.dry_run }}
        run: |
          cargo publish -p pbrs --dry-run
          cargo publish -p protobuf-tonic --dry-run
          cargo publish -p pbrs-grpc --dry-run

      - name: Publish to Crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cargo publish -p pbrs
          echo "Waiting for pbrs to be indexed on crates.io..."
          for i in $(seq 1 30); do
            if curl -fsSA 'pbrs-release/1' 'https://crates.io/api/v1/crates/pbrs/0.1.0' >/dev/null 2>&1; then
              echo "pbrs 0.1.0 is live on crates.io"
              break
            fi
            sleep 10
          done
          cargo publish -p protobuf-tonic
          cargo publish -p pbrs-grpc

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
