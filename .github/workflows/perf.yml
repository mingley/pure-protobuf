# Performance thresholds stay advisory until SB-20. Broken measurement
# infrastructure fails visibly, and invalid artifacts never count as noise data.
name: dev-loop perf

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pbrs-grpc/src/**"
      - "protobuf-tonic/src/**"
      - "bench/devloop/**"
      - "scripts/devloop.sh"
      - "scripts/perf-report.py"
      - ".github/workflows/perf.yml"
  pull_request:
    paths:
      - "src/**"
      - "pbrs-grpc/src/**"
      - "protobuf-tonic/src/**"
      - "bench/devloop/**"
      - "scripts/devloop.sh"
      - "scripts/perf-report.py"
      - ".github/workflows/perf.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full 40-character base commit SHA
        required: true
        type: string
      head_sha:
        description: Full head SHA (empty means the selected workflow revision)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  PBRS_PROTOC_JOBS: "2"

jobs:
  devloop-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve immutable comparison revisions
        id: revisions
        run: |
          python3 scripts/perf-report.py revisions \
            --event-name "$GITHUB_EVENT_NAME" --event "$GITHUB_EVENT_PATH" \
            --default-head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Prepare isolated base worktree
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/devloop-base" "$BASE_SHA"
          mkdir -p perf-artifacts
      - name: Install pinned-compiler build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - uses: actions/cache@v4
        with:
          path: third_party/protobuf
          key: protobuf-src-${{ hashFiles('vendor/google/PIN', 'vendor/google/SHA') }}
      - uses: actions/cache@v4
        with:
          path: target/pinned-protoc-build
          key: pinned-protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/google/PIN', 'vendor/google/SHA') }}
      - uses: actions/cache@v4
        with:
          path: bench/devloop/target
          key: devloop-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bench/devloop/Cargo.lock', 'Cargo.lock') }}
      - name: Build compiler with pinned Rust code generation
        run: |
          scripts/build-pinned-protoc.sh
          echo "$PWD/target/pinned-protoc-build" >> "$GITHUB_PATH"

      - name: Use instruction counters only when available
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          if command -v perf >/dev/null 2>&1; then
            if perf stat -e instructions -- true >/dev/null 2>&1; then
              echo "perf: usable"
            else
              sudo mv "$(command -v perf)" "$(command -v perf).hidden-by-perf-yml"
              echo "perf: unavailable; reports will say not_run"
            fi
          fi

      - name: Measure base
        if: ${{ !cancelled() && steps.revisions.outcome == 'success' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/devloop-base"
          # Use the candidate's reporting wrapper for both revisions, while
          # each build still reads that revision's own source and lockfile.
          PBRS_DEVLOOP_ROOT="$PWD" PBRS_DEVLOOP_COMMIT="$BASE_SHA" \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/bench/devloop/target" \
            bash "$GITHUB_WORKSPACE/scripts/devloop.sh" \
            --out "$GITHUB_WORKSPACE/perf-artifacts/base.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/perf-artifacts/base.log"
      - name: Measure head
        if: ${{ !cancelled() && steps.revisions.outcome == 'success' }}
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set -o pipefail
          PBRS_DEVLOOP_COMMIT="$HEAD_SHA" \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/bench/devloop/target" \
            bash scripts/devloop.sh --out perf-artifacts/head.json \
            2>&1 | tee perf-artifacts/head.log

      - name: Verify measurement evidence
        id: evidence
        if: ${{ !cancelled() && steps.revisions.outcome == 'success' }}
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          mkdir -p perf-artifacts
          python3 scripts/perf-report.py verify \
            --base perf-artifacts/base.json --head perf-artifacts/head.json \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --out perf-artifacts/validation.json --summary perf-artifacts/summary.md
      - name: Compare performance (advisory)
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        run: |
          set +e
          bench/devloop/target/release/devloop compare \
            --baseline perf-artifacts/base.json --current perf-artifacts/head.json \
            --budget bench/devloop/baselines/picker.json \
            > perf-artifacts/compare.txt 2>&1
          comparison_status=$?
          set -e
          cat perf-artifacts/compare.txt
          printf '\nComparison exit: %s (advisory; SB-20 sets gates).\n' \
            "$comparison_status" >> perf-artifacts/summary.md
      - name: Publish evidence summary
        if: always()
        run: |
          if [ -f perf-artifacts/summary.md ]; then
            cat perf-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Measurement setup did not complete; no qualifying evidence." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devloop-${{ github.run_id }}
          retention-days: 180
          if-no-files-found: warn
          path: perf-artifacts/
