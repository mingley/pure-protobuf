[workspace]
members = [".", "protobuf-tonic", "pbrs-grpc"]
exclude = [
    "bench",
    "tonic-bench",
    "rpc-bench",
    "v4_person",
    "v4_tat",
    "buffa_tat",
    "buffa_person",
    "prost_tat",
    "rust_out_shared",
    "rust_out_person",
    "grpc_remap",
    "parse-leftover",
    "target",
]
resolver = "2"

[package]
name = "pbrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Pure-Rust Protocol Buffers kernel with the Google protobuf v4 application API (not crates.io protobuf 4.x upb/C, not prost)"
repository = "https://github.com/mingley/pure-protobuf"
readme = "README.md"
keywords = ["protobuf", "serialization", "proto"]
categories = ["encoding"]
include = [
    "src/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "clippy.toml",
    "rustfmt.toml",
    "vendor/google/conformance_fds.bin",
]

[lib]
name = "pbrs"
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-pbrs"
path = "src/bin/protoc-gen-pbrs.rs"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[dependencies]
bytes = "1"
paste = "1.0"
serde = "1.0"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
simdutf8 = "0.1"

[dev-dependencies]
# none: tests drive the public crate API only

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "deny"
# MiniTable, ProtoStr, packed memcpy, and JSON strtod need `unsafe`.
# `forbid` cannot be overridden; `deny` plus per-block `SAFETY` comments
# is the enforceable bar.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"
# `unused_results` fires on builder returns (`Command::arg` → `&mut Command`)
# and is not the Result-must-use lint. That bar is `unused_must_use`.
unused_results = "allow"

[workspace.lints.clippy]
# Allow- or warn-by-default only. Deny-by-default rustc/clippy lints are not
# repeated here.
# `allow_attributes` stays allow: generated `#[allow(..., reason = "...")]`
# would fail `unfulfilled_lint_expectations` under `#[expect]`.
# Allows without a reason stay denied.
allow_attributes = "allow"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
mem_forget = "deny"

# Blocking IO and lock-across-await.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
indexing_slicing = "deny"

# Integer and conversion footguns.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
lossy_float_literal = "deny"
