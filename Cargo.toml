[workspace]
members = [".", "protobuf-tonic"]
exclude = [
    "bench",
    "tonic-bench",
    "v4_person",
    "v4_tat",
    "buffa_tat",
    "buffa_person",
    "prost_tat",
    "rust_out_shared",
    "rust_out_person",
    "grpc_remap",
    "parse-leftover",
    "target",
]
resolver = "2"

[package]
name = "pbrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Pure-Rust Protocol Buffers kernel with the Google protobuf v4 application API (not crates.io protobuf 4.x upb/C, not prost)"
repository = "https://github.com/mingley/pure-protobuf"
readme = "README.md"
keywords = ["protobuf", "serialization", "proto"]
categories = ["encoding"]
publish = false

[lib]
name = "pbrs"
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-pbrs"
path = "src/bin/protoc-gen-pbrs.rs"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[dependencies]
bytes = "1"
paste = "1.0"
serde = "1.0"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[dev-dependencies]
# none: tests drive the public crate API only
