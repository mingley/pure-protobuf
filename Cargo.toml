[workspace]
members = [
    ".",
    "protobuf-tonic",
    "pbrs-grpc",
    "examples/greeter",
    "examples/axum-cohost",
    "examples/tonic-ports",
]
exclude = [
    "bench",
    "bench/devloop",
    "tonic-bench",
    "rpc-bench",
    "v4_person",
    "v4_tat",
    "buffa_tat",
    "buffa_person",
    "prost_tat",
    "rust_out_shared",
    "rust_out_person",
    "grpc_remap",
    "parse-leftover",
    "target",
    "fuzz",
]
resolver = "2"

[package]
name = "pbrs"
version = "0.2.1"
authors = ["Michael Ingley <michael.ingley@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Protocol Buffers runtime and code generator with the Google protobuf v4 application API"
repository = "https://github.com/mingley/pure-protobuf"
readme = "README.md"
keywords = ["protobuf", "serialization", "proto"]
categories = ["encoding"]
include = [
    "/src/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/clippy.toml",
    "/rustfmt.toml",
    "/vendor/google/conformance_fds.bin",
]

[lib]
name = "pbrs"
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-pbrs"
path = "src/bin/protoc-gen-pbrs.rs"
required-features = ["codegen"]

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
required-features = ["conformance"]

[features]
default = ["std", "codegen", "conformance", "json", "reflect", "text"]
# Explicit std wins if features unify. Without alloc-only, existing runtime-only
# consumers continue using std even when default features are disabled.
std = ["bytes/std", "simdutf8/std"]
# Initial native binary profile for supported bare-metal targets. This does not
# provide a no_std transport, reflection, formats, or the rust_out ABI.
alloc-only = []
# Build-time generator APIs (`pbrs::codegen`). This includes descriptor
# parsing, but not JSON/text runtime helpers unless those features are
# selected separately.
codegen = ["std", "reflect"]
# Bundled conformance/WKT generated messages and the conformance binary support.
conformance = ["std", "json", "reflect", "text"]
# Runtime descriptor pool and DynamicMessage.
reflect = ["std"]
# ProtoJSON support for DynamicMessage and generated field-wise helpers.
json = ["std", "reflect", "dep:serde", "dep:serde_json"]
# Text-format support for DynamicMessage and generated field-wise helpers.
text = ["std", "reflect"]
# Bench-only user-space copy counters (SB-13). Off by default; every
# note call compiles to nothing without it. Bench binaries only.
copy-counts = ["std"]

[dependencies]
bytes = { version = "1", default-features = false }
paste = "1.0"
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", features = ["arbitrary_precision"], optional = true }
simdutf8 = { version = "0.1", default-features = false }

# Cargo features are additive; the absence of alloc-only cannot activate a
# dependency feature. Preserve today's runtime-only std dependency behavior on
# existing OS targets, including simdutf8's runtime CPU dispatch.
[target.'cfg(not(target_os = "none"))'.dependencies]
bytes = { version = "1", default-features = false, features = ["std"] }
simdutf8 = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# none: tests drive the public crate API only

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "deny"
# MiniTable, ProtoStr, packed memcpy, and JSON strtod need `unsafe`.
# `forbid` cannot be overridden; `deny` plus per-block `SAFETY` comments
# is the enforceable bar.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"
# `unused_results` fires on builder returns (`Command::arg` → `&mut Command`)
# and is not the Result-must-use lint. That bar is `unused_must_use`.
unused_results = "allow"

[workspace.lints.clippy]
# Allow- or warn-by-default only. Deny-by-default rustc/clippy lints are not
# repeated here.
# `allow_attributes` stays allow: generated `#[allow(..., reason = "...")]`
# would fail `unfulfilled_lint_expectations` under `#[expect]`.
# Allows without a reason stay denied.
allow_attributes = "allow"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
mem_forget = "deny"

# Blocking IO and lock-across-await.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
indexing_slicing = "deny"

# Integer and conversion footguns.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
lossy_float_literal = "deny"
