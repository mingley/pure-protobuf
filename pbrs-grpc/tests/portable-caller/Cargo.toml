[package]
name = "pbrs-grpc-portable-caller-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

# This separate application supplies its own provider. Its ring dependency is
# not enabled in the shipping workspace.
[workspace]

[dependencies]
pbrs-grpc = { path = "../.." }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
tokio = { version = "1.49", features = ["rt", "macros", "net", "time", "io-util"] }

[[test]]
name = "portable"
path = "tests/portable.rs"
