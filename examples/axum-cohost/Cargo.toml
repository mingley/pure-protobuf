[package]
name = "pbrs-grpc-example-axum-cohost"
version = "0.1.0"
authors = ["Michael Ingley <michael.ingley@gmail.com>"]
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
description = "Co-host pbrs-grpc and axum routes on one port"

[[bin]]
name = "axum-cohost"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
pbrs-grpc = { path = "../../pbrs-grpc", features = ["tower"] }
tonic-web = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server-auto", "service", "tokio"] }
pbrs = { path = "../.." }

[lints]
workspace = true
