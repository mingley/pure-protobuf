[package]
name = "parse-4kib-delta"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Throwaway leftover 4 KiB hello Parse Δ timing vs prost after #34. Not a workspace member. MEASURE ONLY."

[workspace]

[dependencies]
pbrs = { path = "../.." }
prost = "0.14"
protobuf-tonic = { path = "../../protobuf-tonic" }

[build-dependencies]
prost-build = "0.14"

[[bin]]
name = "parse-4kib-delta"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
