[package]
name = "pbrs-rpc-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Loopback empty_unary/large_unary/stream/ping_pong/upload: pbrs-grpc vs tonic 0.14"

[workspace]

[dependencies]
http = "1"
pbrs = { path = ".." }
pbrs-grpc = { path = "../pbrs-grpc" }
prost = "0.14"
protobuf-tonic = { path = "../protobuf-tonic" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "io-std"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"

[build-dependencies]
pbrs = { path = ".." }
tonic-prost-build = "0.14"

[[bin]]
name = "rpc-bench"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
