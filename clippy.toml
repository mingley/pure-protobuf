# Workspace clippy configuration.
# Restriction lints only; rustc/clippy deny-by-default is not repeated here.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

too-many-lines-threshold = 200

doc-valid-idents = [ "..", "LinkedIn", "MySQL", "REST.li", "SQLAlchemy", "Updog" ]

# Blocking calls on an async executor. Enumeration, not a proof: rustc has no
# effect system for "this function blocks".
#
# pbrs kernel / plugin codegen is sync (build.rs, protoc plugin). Those paths
# use std::fs with an explicit clippy expect. protobuf-tonic is the async
# crate and must not call these on the executor.
disallowed-methods = [
  { path = "std::thread::sleep", reason = "Blocks the executor thread. Use tokio::time::sleep." },
  { path = "std::fs::read", reason = "Blocking IO on an async runtime. Use tokio::fs." },
  { path = "std::fs::read_to_string", reason = "Blocking IO on an async runtime. Use tokio::fs." },
  { path = "std::fs::write", reason = "Blocking IO on an async runtime. Use tokio::fs." },
  { path = "std::net::TcpStream::connect", reason = "Blocking connect. Use tokio::net::TcpStream." },
]

disallowed-types = [
  { path = "std::sync::Mutex", reason = "Held across await points too easily. Use tokio::sync::Mutex, or parking_lot for short non-async critical sections." },
  { path = "std::sync::RwLock", reason = "Held across await points too easily. Use tokio::sync::RwLock, or parking_lot for short non-async critical sections." },
]

# These guards encode thread-local enter/exit state. Holding one across an
# await lets another task run inside the wrong trace context.
await-holding-invalid-types = [
  { path = "tracing::span::Entered", reason = "Do not hold a tracing span guard across await. Use Future::instrument or #[instrument]." },
  { path = "tracing::span::EnteredSpan", reason = "Do not hold a tracing span guard across await. Use Future::instrument or #[instrument]." },
]
