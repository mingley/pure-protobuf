// Protocol Buffers - Google's data interchange format
// Pinned Edition 2024 Fixture: Explicit Overrides
//
// Demonstrates explicit overrides of all core features under edition = "2024":
// - field_presence = IMPLICIT (field does not track presence, zero defaults not on wire)
// - field_presence = LEGACY_REQUIRED (field must be present on wire)
// - repeated_field_encoding = EXPANDED (repeated scalars encoded as repeated tags, not packed)
// - utf8_validation = NONE (string accepts arbitrary bytes without UTF-8 rejection)
// - message_encoding = DELIMITED (submessage encoded with START_GROUP / END_GROUP wire tags)
// - json_format = LEGACY_BEST_EFFORT (message allows legacy best-effort JSON)
// - enum_type = CLOSED (enum values outside definition treated as unknown fields)

edition = "2024";

package edition2024.overrides;

message OverridesMessage {
  int32 implicit_int32 = 1 [features.field_presence = IMPLICIT];
  int32 required_int32 = 2 [features.field_presence = LEGACY_REQUIRED];
  repeated int32 expanded_int32 = 3 [features.repeated_field_encoding = EXPANDED];
  string unverified_string = 4 [features.utf8_validation = NONE];
  SubDelimited delimited_message = 5 [features.message_encoding = DELIMITED];
  SubJsonBestEffort json_message = 6;
  ClosedEnum closed_enum = 7;
}

message SubDelimited {
  string text = 1;
}

message SubJsonBestEffort {
  option features.json_format = LEGACY_BEST_EFFORT;
  string text = 1;
}

enum ClosedEnum {
  option features.enum_type = CLOSED;
  CLOSED_ZERO = 0;
  CLOSED_ONE = 1;
}
