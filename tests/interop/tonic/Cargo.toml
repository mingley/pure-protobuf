[package]
name = "pbrs-tonic-interop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Tonic 0.14 mixed-peer interop test runner"

[workspace]

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
pbrs = { path = "../../../" }
pbrs-grpc = { path = "../../../pbrs-grpc" }
pin-project-lite = "0.2"
protobuf-tonic = { path = "../../../protobuf-tonic" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tower-service = "0.3"

[[bin]]
name = "tonic-interop"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
