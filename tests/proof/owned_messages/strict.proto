syntax = "proto3";
package strict;
message StrictNode {
  StrictNode child = 1;
  string text = 2;
}
message CompactNode {
  int32 n = 1;
  CompactNode child = 2;
}
message Blob {
  bytes data = 1;
}
message BlobRoot {
  Blob child = 1;
  repeated Blob children = 2;
  map<int32, Blob> values = 3;
}

// Scalar-only map values need no retained parse frame in the owned profile.
message ScalarValue {
  int64 n = 1;
  fixed64 stamp = 2;
  bool ready = 3;
}
message ScalarRoot {
  map<int32, ScalarValue> values = 1;
}

// A scalar map must not stop later eager children sharing the parent frame.
message MixedScalarRoot {
  map<int32, ScalarValue> values = 1;
  repeated Blob children = 2;
}
