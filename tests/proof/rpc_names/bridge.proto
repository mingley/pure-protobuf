syntax = "proto3";
package proof.rpcbridges;
message Input {}
message Output {}
// Literal ::pbrs_grpc protobuf_tonic ::pbrs_grpc_extra protobuf_tonic_extra.
service protobuf_tonic {
  rpc Unary(Input) returns (Output);
  rpc Client(stream Input) returns (Output);
  rpc Server(Input) returns (stream Output);
  rpc Bidi(stream Input) returns (stream Output);
}
service grpc_bridge_alias { rpc Unary(Input) returns (Output); }
service adapter_bridge_alias { rpc Unary(Input) returns (Output); }
