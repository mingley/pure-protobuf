syntax = "proto3";
package strict;
message StrictNode {
  StrictNode child = 1;
  string text = 2;
  int32 __pbrs_validate_self = 3;
}
message CompactNode {
  int32 n = 1;
  CompactNode child = 2;
}
message RecursiveChoice {
  oneof value {
    RecursiveChoice nested = 1;
    string text = 2;
  }
}
message RecursiveSequence {
  RecursiveSequence child = 1;
  repeated RecursiveSequence children = 2;
  int32 n = 3;
}
message Blob {
  bytes data = 1;
}
message BlobRoot {
  Blob child = 1;
  repeated Blob children = 2;
  map<int32, Blob> values = 3;
}
